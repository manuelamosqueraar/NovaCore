<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCore | Enterprise Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Nova<span>Core</span></div>
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#contacto" class="btn-nav">Contacto</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Soluciones de <br><span>Próxima Generación</span></h1>
        <p>Expertos en infraestructura digital y datos corporativos.</p>
        <a href="#contacto" class="btn-main">Empezar ahora</a>
    </header>

    <section id="contacto" class="contact-section">
        <h2>Hablemos de tu proyecto</h2>
        <form id="contact-form">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <button type="submit">Enviar a la Base de Datos</button>
        </form>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
